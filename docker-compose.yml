services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: franquicias
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    environment:
      DB_URL: jdbc:mysql://db:3306/franquicias
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"
